{% macro calendar_drawer(items, drawer_id='opportunity-calendar', eyebrow='Opportunities') %}
<div class="calendar-drawer-shell" data-calendar-drawer-shell data-calendar-drawer-id="{{ drawer_id }}">
  <button
    type="button"
    class="calendar-drawer-tab"
    data-calendar-drawer-toggle
    aria-controls="{{ drawer_id }}"
    aria-expanded="false"
  >
    <span aria-hidden="true">▣</span>
    <span>Calendar</span>
  </button>
  <aside
    id="{{ drawer_id }}"
    class="calendar-drawer"
    data-calendar-drawer
    aria-labelledby="{{ drawer_id }}-title"
    aria-hidden="true"
  >
    <header class="calendar-drawer-header">
      <div>
        <h2 id="{{ drawer_id }}-title"><span aria-hidden="true">▣</span> Calendar</h2>
        <p>{{ eyebrow }}</p>
      </div>
      <button type="button" class="calendar-drawer-close" data-calendar-drawer-close aria-label="Close calendar">×</button>
    </header>
    <div class="calendar-drawer-controls">
      <button type="button" class="btn btn-sm btn-outline-secondary" data-calendar-today>Today</button>
      <div class="calendar-month-navigation">
        <button type="button" data-calendar-previous aria-label="Previous month">‹</button>
        <strong data-calendar-month aria-live="polite"></strong>
        <button type="button" data-calendar-next aria-label="Next month">›</button>
      </div>
    </div>
    <div class="calendar-weekdays" aria-hidden="true">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="calendar-drawer-grid" data-calendar-grid role="grid" aria-label="Opportunity deadlines"></div>
  </aside>
  <script type="application/json" data-calendar-items>{{ items|tojson }}</script>
</div>
{% endmacro %}
